name: bunly
description: Anxiety & Panic Companion.
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6
  sign_in_with_apple: ^8.1.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  audioplayers: ^6.5.1
  shared_preferences: ^2.5.3
  purchases_flutter: ^8.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#7634E0"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/bunly/
    - assets/images/bunly/emotions/
    - assets/images/bunly/poses/
    - assets/images/bunly/activities/
    - assets/images/bunly/panic/
    - assets/images/bunly/journey/
    - assets/images/bunly/insights/
    - assets/images/bunly/today/
    - assets/images/bunly/you/
    - assets/images/bunly/cards/
    - assets/icons/
    - assets/audio/
    - assets/animations/
    - assets/journey/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
